<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homigos Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f7f9fc; --surface:#fff; --ink:#161d2b; --muted:#5f6878; --rule:#d9dfe8; --accent:#1f5fd1; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --paper:#0e131c; --surface:#151c28; --ink:#e8edf5; --muted:#97a1b3; --rule:#2a3445; --accent:#7fa8f5; } }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Geist",system-ui,sans-serif; padding:48px 20px; }
  main { max-width:640px; margin:0 auto; display:grid; gap:16px; }
  h1 { margin:0 0 8px; font-size:30px; letter-spacing:-.02em; }
  p { margin:0; color:var(--muted); }
  a.card { display:grid; gap:4px; text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:18px 20px; }
  a.card:hover { border-color:var(--accent); }
  a.card b { color:var(--accent); font-size:17px; }
</style>
</head>
<body>
<main>
  <h1>Homigos</h1>
  <p>Project documents for review.</p>
  <a class="card" href="progress-report/"><b>Progress report</b><span>What was built since the marketplace audit, and what we need from you to finish.</span></a>
  <a class="card" href="e2e-flow/"><b>Screen walkthrough</b><span>Real screenshots of every role's flow on the live platform.</span></a>
</main>
</body>
</html>
